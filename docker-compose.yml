services:
  viewer:
    build: .
    ports:
      - "3939:3939"
    volumes:
      - ./models:/app/models
    restart: unless-stopped

  feedback:
    build: ./feedback_tool
    ports:
      - "3940:3940"
    volumes:
      - ./models:/app/models
      # 개발 편의: 코드 변경이 rebuild 없이 반영됨 (디렉토리 마운트라 단일파일 inode 문제 없음)
      # inject.js(정적)는 즉시, server.py 변경은 `docker compose restart feedback` 로 반영
      - ./feedback_tool:/app
    restart: unless-stopped
