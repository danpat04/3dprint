<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<base href="__BASE__">
<title>그리기</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/@excalidraw/excalidraw@0.18.0/dist/prod/index.css">
<link rel="stylesheet" href="static/app.css">
<style>
  body { height: 100vh; display: flex; flex-direction: column; margin: 0; }
  #bar { display: flex; gap: 8px; align-items: center; padding: 8px 12px;
         border-bottom: 1px solid #2a2a30; flex-wrap: wrap; }
  #bar input { background: #1c1c21; border: 1px solid #2a2a30; color: #e8e8ea;
               border-radius: 6px; padding: 6px 9px; font: inherit; font-size: 13px; }
  #note { flex: 1; min-width: 180px; }
  #save { background: #2f6fd0; border: 0; color: #fff; border-radius: 6px;
          padding: 7px 14px; cursor: pointer; font: inherit; font-size: 13px; }
  #save:disabled { background: #333; color: #888; cursor: default; }
  #root { flex: 1; position: relative; }
  .excalidraw { --color-primary: #2f6fd0; }
  #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
           background: #101014ee; border: 1px solid #2a2a30; color: #e8e8ea;
           padding: 9px 16px; border-radius: 8px; font-size: 13px;
           opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
</style></head>
<body>
<div id="bar">
  <a class="back" id="back" href=".">←</a>
  <b id="ctx" style="font-size:13px"></b>
  <input id="name" placeholder="스케치 이름" hidden>
  <input id="note" placeholder="메모 (선택)">
  <button id="save">저장</button>
</div>
<div id="root"><div class="muted" style="padding:20px">Excalidraw 불러오는 중…</div></div>
<div id="toast"></div>

<script>window.EXCALIDRAW_ASSET_PATH =
  "https://unpkg.com/@excalidraw/excalidraw@0.18.0/dist/prod/";</script>
<script type="module">
import React from "https://esm.sh/react@18.3.1";
import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";
import * as EX from "https://esm.sh/@excalidraw/excalidraw@0.18.0?deps=react@18.3.1,react-dom@18.3.1";

const q = new URLSearchParams(location.search);
const slug = q.get("p") || "";
const part = q.get("part") || "";
const bg = q.get("bg") || "";
const kind = bg ? "feedback" : "draft";

document.getElementById("ctx").textContent =
  `${slug}${part ? " · " + part : ""} — ${kind === "feedback" ? "피드백" : "드래프트"}`;
document.getElementById("back").href = `p/${slug}`;
if (kind === "draft") document.getElementById("name").hidden = false;

const blobToDataURL = b => new Promise((res, rej) => {
  const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej;
  fr.readAsDataURL(b);
});
let tt;
function toast(m) {
  const t = document.getElementById("toast");
  t.textContent = m; t.classList.add("show");
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 3500);
}

let api = null;
createRoot(document.getElementById("root")).render(
  React.createElement(EX.Excalidraw, {
    excalidrawAPI: a => { api = a; if (bg) loadBackground(); },
    theme: "dark",
    UIOptions: { canvasActions: { loadScene: false, saveToActiveFile: false } },
  })
);

// 3D 뷰 캡처를 배경으로 깔고 잠근다
async function loadBackground() {
  try {
    const res = await fetch(`capture/${bg}`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const dataURL = await blobToDataURL(await res.blob());
    const img = await new Promise((r, j) => {
      const i = new Image(); i.onload = () => r(i); i.onerror = j; i.src = dataURL;
    });
    api.addFiles([{ id: "bg", dataURL, mimeType: "image/png", created: Date.now() }]);
    api.updateScene({ elements: EX.convertToExcalidrawElements([{
      type: "image", fileId: "bg", x: 0, y: 0,
      width: img.naturalWidth, height: img.naturalHeight, locked: true,
    }]) });
    api.scrollToContent(undefined, { fitToContent: true });
  } catch (e) {
    toast("캡처를 불러오지 못했습니다 (만료?) — 백지로 진행");
  }
}

document.getElementById("save").onclick = async () => {
  if (!api) return;
  const elements = api.getSceneElements();
  if (!elements.length) { toast("그린 내용이 없습니다"); return; }
  const nameEl = document.getElementById("name");
  if (kind === "draft" && !nameEl.value.trim()) {
    toast("스케치 이름을 입력하세요"); nameEl.focus(); return;
  }
  const btn = document.getElementById("save");
  btn.disabled = true; btn.textContent = "저장 중…";
  try {
    const blob = await EX.exportToBlob({
      elements, files: api.getFiles(), mimeType: "image/png",
      appState: { ...api.getAppState(), exportBackground: true,
                  viewBackgroundColor: "#ffffff" },
      maxWidthOrHeight: 2000,
    });
    const res = await fetch(`note/${slug}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        kind, part, name: nameEl.value || "",
        note: document.getElementById("note").value || "",
        image: await blobToDataURL(blob),
      }),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.status);
    toast("저장됨: " + (await res.json()).path);
  } catch (e) {
    toast("저장 실패: " + e.message);
  } finally {
    btn.disabled = false; btn.textContent = "저장";
  }
};
</script>
</body></html>
